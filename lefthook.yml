pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})"
      fail_text: "Files are not gofmt-formatted; run `gofmt -w` on them."
    vet:
      glob: "*.go"
      run: go vet ./...
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

pre-push:
  parallel: true
  commands:
    test:
      run: go test ./...
    lint:
      run: golangci-lint run ./...
