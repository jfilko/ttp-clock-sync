name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install HID build dependencies (Linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BIN=trs-clock-sync
          [ "${{ matrix.goos }}" = "windows" ] && BIN=trs-clock-sync.exe
          TAGS=""
          # The default libusb backend never fills in usage_page/usage on Linux
          # (bearsh/hid ships that as an opt-in "invasive" ioctl), which is what
          # daemon.enumerate() matches devices on — so without the hidraw backend
          # the daemon can never detect the dock on Linux, even as root.
          [ "${{ matrix.goos }}" = "linux" ] && TAGS="-tags hidraw"
          mkdir -p dist
          go build -trimpath $TAGS -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${BIN}" ./cmd/trs-clock-sync
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BIN=${BIN}" >> "$GITHUB_ENV"
      - name: Archive (tar.gz)
        if: matrix.goos != 'windows'
        shell: bash
        run: tar -C dist -czf "trs-clock-sync_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" "${BIN}"
      - name: Archive (zip)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:BIN" -DestinationPath "trs-clock-sync_${env:VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate checksums
        run: (cd release-artifacts && sha256sum * > checksums.txt)
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
